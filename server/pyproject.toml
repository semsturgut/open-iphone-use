[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-iphone-use-server"
version = "0.1.0"
requires-python = ">=3.11"
description = "Let AI agents use your iPhone over USB or Wi-Fi through Xcode's CoreDevice services"
dependencies = [
    "Pillow>=11,<14", "tomlkit>=0.13,<1",
    # CoreDevice: rootless RSD tunnel, VideoToolbox stream decode and HID.
    "pymobiledevice3>=11.49,<12",
]

[project.scripts]
open-iphone-use = "oiu.cli:main"

[tool.setuptools.package-data]
oiu = ["web/*"]
