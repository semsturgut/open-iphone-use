<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Open iPhone Use • Devices</title><link rel="stylesheet" href="/style.css">
<header><div><h1>Open iPhone Use</h1><p>Your phones, together.</p></div><span id="count">Connecting</span></header>
<main><form id="login"><label>Operator token <input id="token" type="password" autocomplete="off" required></label><button>Connect</button></form>
<div id="workspace" hidden><form id="add"><label>New phone <input id="name" placeholder="e.g. Test iPhone" maxlength="80" required></label><button>Create sharing link</button></form><p id="invite"></p><p class="hint">Open each phone’s own link in Safari and approve sharing. Click a live screen to tap after pairing and preparation.</p><div id="grid"></div><p id="empty" hidden>Create a sharing link for each iPhone. Its screen will appear here when sharing starts.</p></div><p id="error" role="status" aria-live="polite"></p></main><script src="/app.js"></script></html>
