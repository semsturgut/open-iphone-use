name: Server checks
on:
  push:
    paths: ['server/**', 'skill/**', 'setup.sh', 'install.sh', '.github/workflows/macos.yml']
  pull_request:
    paths: ['server/**', 'skill/**', 'setup.sh', 'install.sh', '.github/workflows/macos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install through setup
        env:
          OIU_INSTALL_ROOT: ${{ runner.temp }}/oiu-runtime
          OIU_BIN_DIR: ${{ runner.temp }}/oiu-bin
          OIU_SOURCE_DIR: ${{ github.workspace }}
        run: sh setup.sh --no-agents
      - name: Server tests
        run: PYTHONPATH=server "$RUNNER_TEMP/oiu-runtime/venv/bin/python" -m unittest discover -s server/tests -v
      - run: node --check server/oiu/web/app.js
      - name: Install and uninstall from a local archive
        run: |
          set -eu
          export HOME="$RUNNER_TEMP/oiu-install-home"
          export OIU_INSTALL_ROOT="$HOME/runtime" OIU_BIN_DIR="$HOME/bin"
          mkdir -p "$HOME/assets"
          git archive --format=tar.gz --prefix=source/ HEAD -o "$HOME/assets/source.tar.gz"
          export OIU_ARCHIVE_URL="file://$HOME/assets/source.tar.gz"
          bash install.sh --version vTEST --no-agents
          "$OIU_BIN_DIR/open-iphone-use" --help
          bash install.sh --uninstall
          test ! -e "$OIU_INSTALL_ROOT"
