name: Release assets
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (draft or published)
        required: true
        type: string
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - name: Upload the source archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -eu
          case "$RELEASE_TAG" in *[!a-zA-Z0-9._-]*|'') echo 'Invalid release tag' >&2; exit 1;; esac
          git archive --format=tar.gz --prefix="open-iphone-use-$RELEASE_TAG/" "$RELEASE_TAG" -o "open-iphone-use-$RELEASE_TAG.tar.gz"
          sha256sum "open-iphone-use-$RELEASE_TAG.tar.gz" > "open-iphone-use-$RELEASE_TAG.tar.gz.sha256"
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "open-iphone-use-$RELEASE_TAG.tar.gz" "open-iphone-use-$RELEASE_TAG.tar.gz.sha256" --clobber
