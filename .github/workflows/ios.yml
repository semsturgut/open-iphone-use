name: iPhone capture
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Validate capture URLs and credentials
        run: |
          swiftc ios/Shared/CaptureStore.swift ios/Tests/main.swift -o /tmp/capture-check
          /tmp/capture-check
      - run: xcodegen generate --spec ios/project.yml
      - name: Build app and broadcast extension without signing
        run: xcodebuild -project ios/OpenIPhoneUse.xcodeproj -scheme OpenIPhoneUse -sdk iphonesimulator -configuration Debug -derivedDataPath "$RUNNER_TEMP/OpenIPhoneUse-iOS" CODE_SIGNING_ALLOWED=NO build
